[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vyapaar-examples"
version = "0.1.0"
description = "Deterministic, offline-runnable reference learning path for Indian equities, NFO options microstructure, factor models, walk-forward optimization (WFO), and the autonomous AI research loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "vyapaar>=0.1.0",
    "vyapaar-adapters>=0.1.0",
    "vyapaar-data>=0.1.0",
    "vyapaar-strategies>=0.1.0",
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "hypothesis>=6.0.0",
]
# Staged-port honba-examples extras (plan 0002); optional at runtime (D7):
# ported modules lazy-import these and degrade gracefully when absent.
ai = [
    "optuna>=3.0.0",
    "scipy>=1.10.0",
]
optimizer = [
    "optuna>=3.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]
mutual-funds = [
    "scipy>=1.10.0",
]
screening = [
    "duckdb>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["vyapaar_examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "site", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [".venv", "site", "build"]

# mirror accommodation (gap 0006): the indicator registry's typed ``update``
# specializations conflict with the base ``Indicator`` protocol by design.
[[tool.mypy.overrides]]
module = [
    "vyapaar_examples._kernel.indicators.*",
    "vyapaar_examples._kernel.declarative",
    "vyapaar_examples._kernel.portfolio_strategy.*",
]
disable_error_code = ["override"]
